<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — ClassWatch</title>
<link rel="stylesheet" href="assets/app.css"><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
<header class="topbar"><div class="wrap topbar-inner">
  <a class="brand" href="index.html"><span>Class<span class="accent">Watch</span></span></a>
  <nav class="nav"><a class="btn btn-primary btn-sm" href="signup.html">Start free trial</a></nav>
</div></header>

<div class="auth-wrap"><div class="auth-card">
  <h1>Welcome back</h1>
  <p class="sub">Log in to manage your classroom. New here? <a href="signup.html">Start a free trial</a>.</p>

  <div class="oauth-row" style="margin-bottom:6px">
    <button type="button" class="oauth-btn" onclick="googleLogin()">G Continue with Google</button>
    <button type="button" class="oauth-btn" onclick="appleLogin()"> Continue with Apple</button>
  </div>

  <div class="divider">email sign-in</div>

  <div id="stepOtp">
    <form id="otpSendForm">
      <label>Email</label><input type="email" id="email" required>
      <div class="error" id="err0"></div>
      <div class="hint" id="devCode" style="display:none;margin:10px 0;padding:10px;background:#422006;border:1px solid #a16207;border-radius:8px"></div>
      <button class="btn btn-primary" type="submit">Email me a security code</button>
    </form>
    <p class="hint" style="text-align:center;margin-top:14px"><a href="#" id="usePw">I have a password instead</a></p>
  </div>

  <div id="step1" style="display:none">
    <form id="pwForm">
      <label>Email</label><input type="email" id="pwEmail" required>
      <label>Password</label><input type="password" id="password" required>
      <div class="error" id="err1"></div>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="hint" style="text-align:center;margin-top:14px"><a href="#" id="useOtp2">← Email me a code instead</a></p>
  </div>

  <div id="step2" style="display:none">
    <p class="sub">We sent a 6-digit security code to <b id="otpEmail"></b>. Enter it below.</p>
    <form id="otpForm">
      <label>Security code</label><input type="text" id="otpCode" inputmode="numeric" maxlength="6" required placeholder="123456">
      <div class="error" id="err2"></div>
      <button class="btn btn-primary" type="submit">Verify &amp; log in</button>
    </form>
    <p class="hint" style="text-align:center;margin-top:14px"><a href="#" id="backPw">← Use a different email</a></p>
  </div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/app.js"></script>
<script>
const nextTarget = new URLSearchParams(location.search).get('next') || 'dashboard.html';

async function sendCode(email) {
  const d = await api('/api/auth/otp/send', { method:'POST', body:{ email } });
  document.getElementById('otpEmail').textContent = email;
  document.getElementById('otpCode').value = '';
  // SMTP not configured yet - surface the dev code so login still works
  const dev = document.getElementById('devCode');
  if (d.dev_code) {
    dev.style.display = 'block';
    dev.innerHTML = '📧 <b>Dev mode (no SMTP configured):</b> your code is <b style="font-size:18px;letter-spacing:3px">' + esc(d.dev_code) + '</b>';
  } else { dev.style.display = 'none'; }
  document.getElementById('stepOtp').style.display = 'none';
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
}

document.getElementById('otpSendForm').onsubmit = async e => {
  e.preventDefault(); hideMsg(document.getElementById('err0'));
  try { await sendCode(document.getElementById('email').value.trim()); }
  catch (ex) { showMsg(document.getElementById('err0'), ex.message); }
};
document.getElementById('usePw').onclick = e => {
  e.preventDefault();
  document.getElementById('pwEmail').value = document.getElementById('email').value;
  document.getElementById('stepOtp').style.display = 'none';
  document.getElementById('step1').style.display = 'block';
};
document.getElementById('useOtp2').onclick = e => {
  e.preventDefault();
  sendCode(document.getElementById('pwEmail').value.trim()).catch(ex => showMsg(document.getElementById('err1'), ex.message));
};

document.getElementById('pwForm').onsubmit = async e => {
  e.preventDefault(); hideMsg(document.getElementById('err1'));
  try {
    const d = await api('/api/auth/login', { method:'POST', body:{
      email: document.getElementById('pwEmail').value.trim(),
      password: document.getElementById('password').value }});
    setSession(d.token, d.profile); location.href = nextTarget;
  } catch (ex) { showMsg(document.getElementById('err1'), ex.message); }
};
document.getElementById('otpForm').onsubmit = async e => {
  e.preventDefault(); hideMsg(document.getElementById('err2'));
  try {
    const d = await api('/api/auth/otp/verify', { method:'POST', body:{
      email: document.getElementById('otpEmail').textContent.trim(),
      code: document.getElementById('otpCode').value.trim() }});
    setSession(d.token, d.profile); location.href = nextTarget;
  } catch (ex) { showMsg(document.getElementById('err2'), ex.message); }
};
document.getElementById('backPw').onclick = e => {
  e.preventDefault();
  document.getElementById('stepOtp').style.display='block';
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='none';
};
</script>
</body>
</html>
