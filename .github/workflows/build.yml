name: Build ClassWatch

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        install: >-
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-make
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-qt6-base
          mingw-w64-ucrt-x86_64-qt6-tools
          mingw-w64-ucrt-x86_64-qt6-websockets
          mingw-w64-ucrt-x86_64-qt6-charts
          mingw-w64-ucrt-x86_64-qt6-5compat
          mingw-w64-ucrt-x86_64-qca-qt6
          mingw-w64-ucrt-x86_64-zlib
          mingw-w64-ucrt-x86_64-libpng
          mingw-w64-ucrt-x86_64-libjpeg-turbo
          mingw-w64-ucrt-x86_64-lzo2
          mingw-w64-ucrt-x86_64-openldap
          mingw-w64-ucrt-x86_64-cyrus-sasl
          mingw-w64-ucrt-x86_64-pkgconf
          mingw-w64-ucrt-x86_64-libvncserver
          mingw-w64-ucrt-x86_64-nsis

    - name: Build ClassWatch
      shell: msys2 {0}
      run: |
        export PATH="/ucrt64/bin:$PATH"
        which cmake
        which mingw32-make
        cmake --version
        mkdir build
        cd build
        cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF -DWITH_BUNDLED_LIBVNC=OFF -DWITH_WEBAPI=OFF -DWITH_PCH=OFF -DWITH_TRANSLATIONS=OFF
        cmake --build . --parallel 2

    - name: Install NSIS
      shell: pwsh
      run: choco install nsis -y --no-progress

    - name: Package Windows Installer
      shell: msys2 {0}
      run: |
        echo "shell=$0 BASH=$BASH_VERSION"
        trap 'echo "=== STEP FAILED near line $LINENO ==="; ls -la "$STAGE" 2>/dev/null | head -30; [ -f NSISOutput.log ] && tail -40 NSISOutput.log' ERR
        export PATH="/ucrt64/bin:$PATH"
        pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-interception 2>/dev/null || true
        cd build
        STAGE="classwatch-win64-1.0.0.0"
        rm -rf "$STAGE"
        mkdir -p "$STAGE"/{plugins,translations,crypto,imageformats,platforms,styles,tls,interception}
        # application binaries
        find . -mindepth 2 -name 'classwatch-*.exe' -exec cp {} "$STAGE/" \;
        cp core/classwatch-core.dll "$STAGE/"
        find plugins/ -name '*.dll' -exec cp {} "$STAGE/plugins/" \;
        mv "$STAGE"/plugins/lib*.dll "$STAGE/" 2>/dev/null || true
        [ -f "$STAGE/plugins/vnchooks.dll" ] && mv "$STAGE/plugins/vnchooks.dll" "$STAGE/"
        # interception runtime library expected at install root by upstream layout
        find /ucrt64/bin /ucrt64/lib -maxdepth 1 -iname 'interception.dll' -exec cp {} "$STAGE/" \; 2>/dev/null || true
        # translations (disabled in CI - keep dir for installer script)
        cp translations/*.qm "$STAGE/translations/" 2>/dev/null || true
        QTPLUG=/ucrt64/lib/qt6/plugins
        # MSYS2 runtime DLLs - walk the full import-table closure with objdump
        # so every transitive MinGW/Qt helper DLL is bundled (ICU, harfbuzz,
        # pcre2, gnutls, etc.). ldd is unavailable in this environment.
        declare -A CW_SEEN=()
        CW_QUEUE=()
        while IFS= read -r f; do CW_QUEUE+=("$f"); done < <(
          find . -name 'classwatch-*.exe'
          find core plugins -name '*.dll' 2>/dev/null
          find "$QTPLUG" -name '*.dll' 2>/dev/null
        )
        i=0
        while [ $i -lt ${#CW_QUEUE[@]} ]; do
          f="${CW_QUEUE[$i]}"; i=$((i+1))
          [ -f "$f" ] || continue
          while IFS= read -r dll; do
            lc=$(printf '%s' "$dll" | tr '[:upper:]' '[:lower:]')
            case "$lc" in *.dll) ;; *) continue ;; esac
            [ -n "${CW_SEEN[$lc]:-}" ] && continue
            CW_SEEN[$lc]=1
            src=$(find /ucrt64/bin /ucrt64/lib -maxdepth 1 -iname "$dll" 2>/dev/null | head -1)
            if [ -n "$src" ]; then
              cp "$src" "$STAGE/"
              CW_QUEUE+=("$src")
            fi
          done < <(objdump -p "$f" 2>/dev/null | awk '/DLL Name/{print $3}')
        done
        echo "bundled ${#CW_SEEN[@]} runtime dlls"
        # supplementary runtime DLLs - the import walk can miss versioned
        # MinGW/Qt helper libraries; copy every matching runtime that exists
        for pat in \
          'libb2-*.dll' 'libdouble-conversion.dll' 'libmd4c.dll' \
          'libfreetype-*.dll' 'libharfbuzz-*.dll' 'libglib-2.0-*.dll' \
          'libgraphite2.dll' 'libicu*.dll' 'libpcre2-*.dll' 'libzstd.dll' \
          'libjpeg-*.dll' 'libgcrypt-*.dll' 'libgpg-error-*.dll' \
          'libgnutls-*.dll' 'libnettle-*.dll' 'libhogweed-*.dll' \
          'libgmp-*.dll' 'libtasn1-*.dll' 'libidn2-*.dll' \
          'libunistring-*.dll' 'libp11-kit-*.dll' 'libffi-*.dll' \
          'libbrotli*.dll' 'libexpat-*.dll' 'libiconv-*.dll' 'libintl-*.dll' \
          'libpcre-*.dll' 'libb2*.dll' 'libmd4c*.dll'; do
          for f in /ucrt64/bin/$pat; do
            [ -f "$f" ] && cp "$f" "$STAGE/"
          done
        done
        ls "$STAGE"/*.dll | wc -l
        # QCA crypto plugin (location varies between MSYS2 package layouts)
        [ -f /ucrt64/lib/qca-qt6/crypto/libqca-ossl.dll ] && cp /ucrt64/lib/qca-qt6/crypto/libqca-ossl.dll "$STAGE/crypto/"
        if [ ! -f "$STAGE/crypto/libqca-ossl.dll" ]; then
          QCA_DLL=$(find /ucrt64 -name "libqca-ossl.dll" 2>/dev/null | head -1)
          [ -n "$QCA_DLL" ] && cp "$QCA_DLL" "$STAGE/crypto/"
        fi
        find /ucrt64 -name "*qca*" 2>/dev/null | head -10
        # Qt plugins - locate dynamically; MSYS2 plugin dir layout varies
        for spec in "imageformats:qjpeg.dll" "platforms:qwindows.dll" "tls:qopensslbackend.dll"; do
          qdir="${spec%%:*}"; qname="${spec##*:}"
          qsrc=$(find /ucrt64 -name "$qname" 2>/dev/null | head -1)
          if [ -n "$qsrc" ]; then cp "$qsrc" "$STAGE/$qdir/"; else echo "MISSING QT PLUGIN: $qname"; fi
        done
        qstyle=$(find /ucrt64 -name 'qwindowsvistastyle.dll' -o -name 'qmodernwindowsstyle.dll' 2>/dev/null | head -1)
        if [ -n "$qstyle" ]; then cp "$(dirname "$qstyle")"/*.dll "$STAGE/styles/" 2>/dev/null || true; fi
        ls "$STAGE"/platforms "$STAGE"/imageformats "$STAGE"/styles "$STAGE"/tls 2>/dev/null
        # interception driver files, desktop duplication engine, docs, installer script
        cp -r ../3rdparty/interception/* "$STAGE/interception/"
        [ -f ../3rdparty/ddengine/ddengine64.dll ] && cp ../3rdparty/ddengine/ddengine64.dll "$STAGE/"
        cp -r ../nsis "$STAGE/"
        cp ../COPYING "$STAGE/LICENSE.TXT"
        cp ../COPYING "$STAGE/COPYING"
        cp ../README.md "$STAGE/README.TXT"
        echo "=== generated nsi ==="
        ls -la nsis/classwatch.nsi || find . -name 'classwatch.nsi' -ls
        cp nsis/classwatch.nsi "$STAGE/"
        # rewrite every compile-time file reference to a backslash-absolute
        # Windows path - NSIS File does not accept "D:/" forward-slash drives
        WIN_STAGE=$(cygpath -w "$PWD/$STAGE")
        ESC_STAGE=$(printf '%s' "$WIN_STAGE" | sed 's/\\/\\\\/g')
        NSI_FILE="$STAGE/classwatch.nsi"
        sed -i \
          -e "s|!define LICENSE_TXT \"COPYING\"|!define LICENSE_TXT \"${ESC_STAGE}\\\\COPYING\"|" \
          -e "s|\"nsis/|\"${ESC_STAGE}\\\\nsis\\\\|g" \
          -e "s|^File \"\([^\"]*\)\"|File \"${ESC_STAGE}\\\\\1\"|g" \
          -e "/File \".*translations/d" \
          "$NSI_FILE"
        # normalize remaining forward slashes inside File paths to backslashes
        sed -i '/File "/s|/|\\|g' "$NSI_FILE"
        # optional plugin payloads must not abort the build if a Qt plugin
        # is absent from the MSYS2 package
        sed -i '/File ".*crypto\\\|File ".*imageformats\\\|File ".*platforms\\\|File ".*styles\\\|File ".*tls\\\|File ".*interception/s|File "|File /nonfatal "|' "$NSI_FILE"
        grep -n 'File "' "$NSI_FILE" | head -8
        # build the installer with native makensis
        echo "=== running makensis ==="
        if ! "/c/Program Files (x86)/NSIS/makensis.exe" "$(cygpath -w "$PWD/$STAGE/classwatch.nsi")"; then
          echo "=== MAKENSIS FAILED ==="
          cat NSISOutput.log 2>/dev/null | tail -50
          exit 1
        fi
        echo "=== makensis done ==="
        find . -maxdepth 2 -name 'classwatch-*-setup.exe' | while read -r f; do
          b=$(basename "$f")
          [ -f "./$b" ] || mv "$f" "./$b"
        done
        ls -la ./*setup*.exe 2>/dev/null || ls -la "$STAGE"/*setup*.exe

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: classwatch-windows-installer
        path: build/*.exe
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # clear stale apt/dpkg locks left by cloud-init or unattended-upgrades
        for i in $(seq 1 60); do
          sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || break
          sleep 5
        done
        sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
        sudo systemctl stop unattended-upgrades 2>/dev/null || true
        # retry loop - runner DNS to ubuntu archives is intermittently flaky
        for attempt in 1 2 3 4 5; do
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 update \
          && sudo timeout 900 apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=3 install -y --no-install-recommends \
          build-essential \
          cmake \
          qt6-base-dev \
          qt6-tools-dev \
          qt6-translations-l10n \
          libqt6core5compat6-dev \
          libssl-dev \
          libqca-qt6-dev \
          libvncserver-dev \
          zlib1g-dev \
          libjpeg-dev \
          libpng-dev \
          liblzo2-dev \
          libldap2-dev \
          libsasl2-dev \
          libpam0g-dev \
          libproc2-dev \
          libfakekey-dev \
          libxtst-dev \
          xorg-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxdamage-dev \
          libxcomposite-dev \
          libxfixes-dev \
          && break
          echo "apt failed (attempt $attempt), retrying in 60s"; sleep 60
        done
        command -v cmake >/dev/null && command -v qmake6 >/dev/null || command -v qmake >/dev/null \
          || { echo "dependency install failed after retries"; exit 1; }

    - name: Build ClassWatch
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF -DWITH_WEBAPI=OFF -DWITH_PCH=OFF -DWITH_TRANSLATIONS=OFF
        cmake --build . --parallel $(nproc)

    - name: Package Linux
      run: |
        cd build
        cpack -G DEB

    - name: Upload Linux Packages
      uses: actions/upload-artifact@v4
      with:
        name: classwatch-linux-packages
        path: build/*.deb
        retention-days: 30

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake qt openssl qca libvncserver openldap cyrus-sasl libpng

    - name: Build ClassWatch
      env:
        PKG_CONFIG_PATH: /opt/homebrew/opt/openldap/lib/pkgconfig:/opt/homebrew/opt/cyrus-sasl/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/openssl@3/lib/pkgconfig
        LDFLAGS: -L/opt/homebrew/opt/openldap/lib -L/opt/homebrew/opt/cyrus-sasl/lib -L/opt/homebrew/opt/openssl@3/lib
        CPPFLAGS: -I/opt/homebrew/opt/openldap/include -I/opt/homebrew/opt/cyrus-sasl/include -I/opt/homebrew/opt/openssl@3/include
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF -DWITH_WEBAPI=OFF -DWITH_PCH=OFF -DWITH_TRANSLATIONS=OFF \
          -DCMAKE_CXX_FLAGS="-Wno-deprecated-declarations" \
          -DLdap_INCLUDE_DIRS=/opt/homebrew/opt/openldap/include \
          -DLdap_LIBRARIES=/opt/homebrew/opt/openldap/lib/libldap.dylib \
          -DLber_LIBRARIES=/opt/homebrew/opt/openldap/lib/liblber.dylib
        cmake --build . --parallel

    - name: Package macOS
      run: |
        cd build
        rm -rf _dmg_src
        mkdir -p _dmg_src
        cmake --install . --prefix "$PWD/_dmg_src"
        ln -sfn /Applications _dmg_src/Applications
        hdiutil create -volname "classwatch-1.0.0.0" -srcfolder _dmg_src -ov -format UDZO classwatch-1.0.0.0-Darwin.dmg

    - name: Upload macOS Package
      uses: actions/upload-artifact@v4
      with:
        name: classwatch-macos-package
        path: build/*.dmg
        retention-days: 30
