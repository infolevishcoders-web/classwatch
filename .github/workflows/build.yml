name: Build ClassWatch

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        install: >-
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-make
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-openssl
          mingw-w64-ucrt-x86_64-qca-qt6
          mingw-w64-ucrt-x86_64-zlib
          mingw-w64-ucrt-x86_64-libpng
          mingw-w64-ucrt-x86_64-libjpeg-turbo
          mingw-w64-ucrt-x86_64-lzo2
          mingw-w64-ucrt-x86_64-openldap
          mingw-w64-ucrt-x86_64-cyrus-sasl
          mingw-w64-ucrt-x86_64-pkgconf

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.7.3'
        arch: win64_mingw
        cache: true
        modules: qtcharts qtwebsockets qt5compat

    - name: Build ClassWatch
      shell: msys2 {0}
      run: |
        export PATH="/ucrt64/bin:$PATH"
        export CMAKE_PREFIX_PATH="/d/a/_temp/qt/6.7.3/mingw_64"
        which cmake
        which mingw32-make
        cmake --version
        mkdir build
        cd build
        cmake .. -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF -DWITH_BUNDLED_LIBVNC=ON -DWITH_WEBAPI=OFF -DWITH_PCH=OFF
        cmake --build . --parallel

    - name: Package Windows Installer
      shell: msys2 {0}
      run: |
        cd build
        cpack -G NSIS

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: classwatch-windows-installer
        path: build/*.exe
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          qt6-base-dev \
          qt6-tools-dev \
          qt6-translations-l10n \
          libqt6core5compat6-dev \
          libssl-dev \
          libqca-qt6-dev \
          libvncserver-dev \
          zlib1g-dev \
          libjpeg-dev \
          libpng-dev \
          liblzo2-dev \
          libldap2-dev \
          libsasl2-dev \
          libpam0g-dev \
          libproc2-dev \
          libfakekey-dev \
          libxtst-dev \
          xorg-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxdamage-dev \
          libxcomposite-dev \
          libxfixes-dev

    - name: Build ClassWatch
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF -DWITH_WEBAPI=OFF -DWITH_PCH=OFF
        cmake --build . --parallel $(nproc)

    - name: Package Linux
      run: |
        cd build
        cpack -G DEB
        cpack -G TGZ

    - name: Upload Linux Packages
      uses: actions/upload-artifact@v4
      with:
        name: classwatch-linux-packages
        path: build/*.deb
        retention-days: 30

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install cmake qt openssl qca libvncserver openldap cyrus-sasl libpng

    - name: Build ClassWatch
      env:
        PKG_CONFIG_PATH: /opt/homebrew/opt/openldap/lib/pkgconfig:/opt/homebrew/opt/cyrus-sasl/lib/pkgconfig:/opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/openssl@3/lib/pkgconfig
        LDFLAGS: -L/opt/homebrew/opt/openldap/lib -L/opt/homebrew/opt/cyrus-sasl/lib -L/opt/homebrew/opt/openssl@3/lib
        CPPFLAGS: -I/opt/homebrew/opt/openldap/include -I/opt/homebrew/opt/cyrus-sasl/include -I/opt/homebrew/opt/openssl@3/include
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DWITH_TESTS=OFF -DWITH_WEBAPI=OFF -DWITH_PCH=OFF \
          -DCMAKE_CXX_FLAGS="-Wno-deprecated-declarations" \
          -DLdap_INCLUDE_DIRS=/opt/homebrew/opt/openldap/include \
          -DLdap_LIBRARIES=/opt/homebrew/opt/openldap/lib/libldap.dylib \
          -DLber_LIBRARIES=/opt/homebrew/opt/openldap/lib/liblber.dylib
        cmake --build . --parallel

    - name: Package macOS
      run: |
        cd build
        cpack -G DragNDrop

    - name: Upload macOS Package
      uses: actions/upload-artifact@v4
      with:
        name: classwatch-macos-package
        path: build/*.dmg
        retention-days: 30
